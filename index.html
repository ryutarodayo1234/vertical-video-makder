<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical Video Maker - 16:9動画を縦に3つ並べて9:16に変換</title>
  <meta name="description" content="1つの16:9動画から縦に3つ並べた9:16ショート動画を作成。上下ブラー背景＆音声1系統。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-icon">📱</div>
        <h1>Vertical Video Maker</h1>
      </div>
      <p class="tagline">16:9動画を縦に3つ隙間なく並べ、最下部の余白にぼかし背景を配置した9:16動画を生成</p>
   
    </header>

    <main class="main-content">
      <!-- 左カラム: 動画選択 & 設定 -->
      <section class="control-panel">
        <div class="panel-section">
          <h2>動画をアップロード</h2>
          <div class="upload-card" id="upload-card">
            <div class="card-header">
              <span class="file-status" id="file-status">動画未選択</span>
              <span class="file-info" id="file-info"></span>
            </div>
            <label class="drop-zone" id="drop-zone">
              <input type="file" id="video-file-input" accept="video/*" class="file-input">
              <div class="drop-content">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span>クリックして動画を選択 または ここにD&D</span>
                <span class="drop-hint">※ 3段すべて16:9クリア動画、一番下の余白にぼかし背景を配置します</span>
              </div>
            </label>

            <!-- 音量コントロール (1つに集約) -->
            <div class="audio-control-row hidden" id="audio-control-row">
              <label for="vol-slider">音量</label>
              <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.05" value="1">
              <button class="mute-btn" id="mute-btn" title="ミュート切替">🔊</button>
            </div>
          </div>
        </div>

        <!-- 出力設定 -->
        <div class="panel-section settings-section">
          <h2>出力設定</h2>
          <div class="setting-item">
            <label for="resolution-select">出力解像度</label>
            <select id="resolution-select">
              <option value="1080x1920" selected>1080 × 1920 (FHD 高画質)</option>
              <option value="720x1280">720 × 1280 (HD 高速)</option>
            </select>
          </div>
          
        </div>
      </section>

      <!-- 右カラム: プレビュー & エクスポート -->
      <section class="preview-panel">
        <div class="preview-container">
          <div class="phone-frame">
            <div class="phone-notch"></div>
            <div class="canvas-wrapper">
              <canvas id="preview-canvas" width="1080" height="1920"></canvas>
              <div class="placeholder-overlay" id="placeholder-overlay">
                <div class="guide-box">
                  <p>動画をセットすると<br>上3段クリア＋下部ぼかし背景の<br>9:16プレビューが表示されます</p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- コントロールバー -->
        <div class="preview-controls">
          <button id="play-btn" class="btn btn-secondary" disabled>
            <span class="icon">▶</span> <span class="label">再生</span>
          </button>
          <div class="timeline-bar">
            <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1" disabled>
          </div>
          <span class="time-label" id="time-display">00:00 / 00:00</span>
        </div>

        <!-- 書き出し & ダウンロード -->
        <div class="action-card">
          <button id="export-btn" class="btn btn-primary" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            9:16 動画を書き出す
          </button>

          <!-- 進捗表示 -->
          <div class="progress-wrap hidden" id="progress-wrap">
            <div class="progress-info">
              <span id="progress-status">レンダリング中...</span>
              <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
          </div>

          <!-- ダウンロード＆保存ボタン群 -->
          <div class="download-wrap hidden" id="download-wrap">
            <button id="share-btn" class="btn btn-share">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
              Apple「写真」アプリに保存 (共有)
            </button>
            <a id="download-link" class="btn btn-download" download="vertical-video-9x16.mp4">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              ファイルとして保存 (MP4)
            </a>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="mp4-muxer.js"></script>
  <script src="app.js"></script>
</body>
</html>
